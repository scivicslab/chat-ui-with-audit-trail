# chat-ui-with-audit-trail
quarkus.http.port=28030

# ---- ChatSession / openai-compat provider ----
# Comma-separated OpenAI-compatible server base URLs. Points at quarkus-gpu-broker's
# OpenAiCompatResource (/v1/chat/completions, /v1/models) rather than a fixed vLLM node
# directly, so requests get the broker's queueing/admission-control/multi-node routing.
chat-ui.servers=http://localhost:28005
# Default model (leave blank to auto-detect the first available)
chat-ui.default-model=google/gemma-4-26B-A4B-it

# ---- Files a conversation may read and write (FileAccessScope_260830_oo01) ----
# Read covers all of ~/works: the documentation portals a conversation searches with search_docs
# live there, and reading the source it is asked about is the same range. Skill roots
# (chat-ui.skill-roots, default ~/.claude/skills) are readable without being listed here, since
# load_skill's third loading level is this same read tool.
chat-ui.read-roots=${user.home}/works
# Write is deliberately narrower than read: a conversation must not be able to rewrite the
# documents it cites, the source it reads, or the skills that steer it.
chat-ui.write-root=${user.home}/works/chat-ui-scratch
