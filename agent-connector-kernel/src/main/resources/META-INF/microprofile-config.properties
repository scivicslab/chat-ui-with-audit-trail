# agent-connector-kernel's defaults (tasks/todo.md, Decisions 12 and 13). An application's application.properties
# overrides them.
#
# Every request to the MCP server needs its scope's key. chat-ui alone sets this to false (Decisions 3 and 13).
agent-connector-kernel.mcp.require-key=true
agent-connector-kernel.mcp.scope-header=X-Agent-Connector-Scope
# The MCP server's path needs an authenticated request, so McpKeyMechanism's refusal is an HTTP status, not an MCP
# error (https://docs.quarkiverse.io/quarkus-mcp-server/2.0.x/reference-security.html, "Securing HTTP Endpoints").
quarkus.http.auth.permission.agent-connector-kernel-mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.agent-connector-kernel-mcp.policy=authenticated
