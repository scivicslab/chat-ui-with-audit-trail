# ssh-connector (tasks/todo.md, stage 11). Its own settings are in ssh-connector.properties in its directory, which
# SshConnectorMain hands Quarkus as quarkus.config.locations before start-up.
#
# Only the owner-only domain socket; no TCP port. SshConnectorMain sets quarkus.http.domain-socket.
quarkus.http.host-enabled=false
quarkus.http.domain-socket-enabled=true
quarkus.vertx.prefer-native-transport=true
quarkus.banner.enabled=false
# Every MCP request needs the scope's key (Decision 13).
agent-connector-kernel.mcp.require-key=true
# The harness owns the terminal; ssh-connector logs to ssh-connector.log in its directory (SshConnectorMain).
quarkus.log.console.enabled=false
quarkus.log.file.enabled=true
