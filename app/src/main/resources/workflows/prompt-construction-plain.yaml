name: prompt-construction-plain
description: |
  Prompt-construction sub-workflow for a conversation that only writes prose
  (AgentLoopDecidesThePrompt_261020_oo01): sends this turn's own text and nothing else — no tool
  instructions, no tool descriptions, no skill catalog, no project instructions. Select it with
  ChatSession.setPromptWorkflowFile(...) (POST .../prompt-workflow).

  The conversation still refuses a tool call it is not allowed to make (ToolSet); it is simply not
  told about any tools, so a model writing prose does not start writing tool calls.

steps:
  - states: ["0", "1"]
    label: take-turn-text
    note: This turn's own text into result.
    actions:
      - actor: ..
        method: turnText
        execution: direct

  - states: ["1", "end"]
    label: queue
    actions:
      - actor: ..
        method: appendConstructedPrompt
        arguments:
          prompt: "jexl: result"
        execution: direct
