name: polish-files
description: |
  Works through a directory of files without anybody watching, fixing each against the checklist one
  item at a time. Where a written standard exists, the plan reads that document and hands it to the
  fixer and to the judge as the rule — the workflow carries the path, not the wording.
params:
  dir:
    label: "The directory to read"
    description: "Every file in it that ends with the suffix is worked through, in name order"
    type: text
  suffix:
    description: "What a file name must end with"
    default: ".md"
  depth:
    description: "How many directory levels to walk; 2 when one document lives per directory"
    type: int
    default: 1
  outDir:
    label: "Where to write the results"
    description: "The fixed files are written here under their own names"
    type: text
  fixer:
    description: "The conversation that rewrites"
    default: "project1/chat-02"
  judge:
    description: "The conversation that decides whether the rule is met"
    default: "project1/chat-03"
  tries:
    description: "How many times one criterion may be sent back before it is left as it was"
    type: int
    default: 5
  fixerProvider:
    description: "The provider the fixer runs on (openai-compat / claude / codex); empty leaves the conversation as it is"
    default: ""
  fixerModel:
    description: "The model the fixer runs on; empty leaves the conversation as it is"
    default: ""
  judgeProvider:
    description: "The provider the judge runs on; empty leaves the conversation as it is"
    default: ""
  judgeModel:
    description: "The model the judge runs on; empty leaves the conversation as it is"
    default: ""
  fixerNoThink:
    description: "true to ask the fixer's model to skip its thinking phase; empty leaves the conversation as it is"
    default: ""
  judgeNoThink:
    description: "true to ask the judge's model to skip its thinking phase; empty leaves the conversation as it is"
    default: ""
  fixerEffort:
    description: "How hard the fixer's harness should work (--effort); empty leaves it as it is"
    default: ""
  judgeEffort:
    description: "How hard the judge's harness should work (--effort); empty leaves it as it is"
    default: ""
steps:
  - states: ["0", "on-their-llms"]
    label: add-fixer
    actions: [{actor: this, method: addWorker, arguments: ["fixer", 'jexl:state.getString("fixer")'], execution: direct}]

  - states: ["on-their-llms", "1"]
    label: put-each-role-on-its-llm
    note: |
      Which model judged and which model wrote is part of what this run was, so the job names them
      rather than leaving them on the conversations. An empty value leaves a conversation as it is;
      a provider this instance was not started with fails here (ChooseTheLlmPerRole_260915_oo01).
    actions:
      - actor: this
        method: setChatProvider
        arguments: ['jexl:state.getString("fixer")', 'jexl:state.getString("fixerProvider")', ""]
        execution: direct
      - actor: this
        method: setChatModel
        arguments: ['jexl:state.getString("fixer")', 'jexl:state.getString("fixerModel")']
        execution: direct
      - actor: this
        method: setChatProvider
        arguments: ['jexl:state.getString("judge")', 'jexl:state.getString("judgeProvider")', ""]
        execution: direct
      - actor: this
        method: setChatModel
        arguments: ['jexl:state.getString("judge")', 'jexl:state.getString("judgeModel")']
        execution: direct
      - actor: this
        method: setChatNoThink
        arguments: ['jexl:state.getString("fixer")', 'jexl:state.getString("fixerNoThink")']
        execution: direct
      - actor: this
        method: setChatNoThink
        arguments: ['jexl:state.getString("judge")', 'jexl:state.getString("judgeNoThink")']
        execution: direct
      - actor: this
        method: setChatEffort
        arguments: ['jexl:state.getString("fixer")', 'jexl:state.getString("fixerEffort")']
        execution: direct
      - actor: this
        method: setChatEffort
        arguments: ['jexl:state.getString("judge")', 'jexl:state.getString("judgeEffort")']
        execution: direct

  - states: ["1", "2"]
    label: add-judge
    note: |
      A file variant has no text yet: each file is read, and kept as it arrived, in take-next-file.
    actions:
      - actor: this
        method: addWorker
        arguments: ["judge", 'jexl:state.getString("judge")']
        execution: direct

  - states: ["2", "next"]
    label: list-files
    actions:
      - actor: this
        method: listFiles
        arguments: ['jexl:state.getString("dir")', 'jexl:state.getString("suffix")', "files", 'jexl:state.getString("depth")']
        execution: direct

  - states: ["next", "enter-1"]
    label: take-next-file
    note: |
      Takes the next file, reads it, and clears the per-criterion budgets so each file starts with
      a full allowance. Fails when the list is empty, and the transition after this one ends the job.
    actions:
      - actor: this
        method: takeNext
        arguments: ["files", "file"]
        execution: direct
      - actor: this
        method: readFile
        arguments: ['jexl:state.getString("file")', "text"]
        execution: direct
      - actor: this
        method: takeFrontMatter
        arguments: ["text", "head", "text"]
        execution: direct
      - actor: this
        method: copyState
        arguments: ["text", "original"]
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: work, value: 'jexl:state.getString("outDir") + "/.work/" + state.getString("file").substring(state.getString("file").lastIndexOf("/") + 1)'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: orig, value: 'jexl:state.getString("work") + ".orig.md"'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: before-path, value: 'jexl:state.getString("work") + ".before.md"'}
        execution: direct
      - actor: this
        method: writeFile
        arguments: ['jexl:state.getString("orig")', "original"]
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-verify, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-1, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-2, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-3, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-4, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-5, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-6, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: tries-7, value: "0"}
        execution: direct

  - states: ["next", "report"]
    label: all-done
    note: Reached when no file is left.
    actions: [{actor: this, method: doNothing, arguments: ["no file left"], execution: direct}]

  - states: ["report", "end"]
    label: say-what-happened
    note: |
      What the run did, in the shape a workflow report has (PluginReport_260403_oo01): the files it
      wrote, the files it left alone, and the criteria where the fixer and the judge did not agree —
      which are the ones a person has to look at, because nothing was changed there
      (WhenTheTwoRolesDoNotAgree_260915_oo01).
    actions:
      - actor: this
        method: joinLines
        arguments: ["done", "doneText"]
        execution: direct
      - actor: this
        method: joinLines
        arguments: ["disagreements", "disagreementsText"]
        execution: direct
      - actor: this
        method: putJson
        arguments:
          path: report
          value: 'jexl:"=== 文章のブラッシュアップ ===\n\n--- 処理したファイル ---\n" + state.getString("doneText") + "\n\n--- 意見が合わず元のままにした観点 ---\n" + state.getString("disagreementsText")'
        execution: direct
      - actor: this
        method: finish
        arguments: ["report"]
        execution: direct

  # ── 1. problemdef ───────────────────────────────────────────────────────────
  - states: ["enter-1", "judge-1"]
    label: enter-1-problemdef
    note: |
      規則は 020_AntiPatternProblemDefinition_260922_oo01.md にある。会話がそれを読む。
      いまの本文を控え、会話が読み書きするファイルへ置く。ここではまだ本文を書き換えない。
    actions:
      - actor: this
        method: copyState
        arguments: ["text", "kept-1"]
        execution: direct
      - actor: this
        method: writeFile
        arguments: ['jexl:state.getString("work")', "text"]
        execution: direct

  - states: ["judge-1", "check-1"]
    label: judge-1-problemdef
    note: 本文がこの規則を満たしているかを見る。満たしていれば本文には触れない。
    actions:
      - actor: this
        method: clearWorker
        arguments: ["judge"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["judge", 'jexl:"規則の文書と本文は、それぞれ別のファイルにある。read ツールを1回に1つのパスで2回呼び、規則を読んでから本文を読むこと。2つのパスを1回の read にまとめないこと。本文がこの規則を満たしているかだけを見る。規則のうち、この本文に当てはまる項目だけで判断する。本文に無い事柄が書かれていないことを理由に REVISE と判断しない。満たしていれば ACCEPT の一語だけを返す。満たしていなければ REVISE: に続けて、満たしていない箇所を具体的に挙げる。ほかのことは書かない。\n\n規則: /home/devteam/works/doc_Base010/docs/ProjectStandard2/030_ProgrammingProject/200_documentation/100_AntiPattern/020_AntiPatternProblemDefinition_260922_oo01/020_AntiPatternProblemDefinition_260922_oo01.md\n本文: " + state.getString("work")']
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["judge", "verdict"]
        execution: direct

  - states: ["judge-1", "enter-2"]
    label: judge-did-not-answer-1
    note: |
      judge が答えなかった。待つのをやめた側が相手の仕事も止め、本文を戻して先へ進む。
      受け皿が無いと、会話ひとつの不調で実行全体が終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("judge")']
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-1", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点1 problemdef | 判定役が答えなかった"'}
        execution: direct

  - states: ["check-1", "enter-2"]
    label: accept-1
    note: 満たしている。本文はそのまま次の規則へ。
    actions: [{actor: this, method: checkState, arguments: ["verdict", "ACCEPT"], execution: direct}]

  - states: ["check-1", "enter-2"]
    label: no-agreement-1
    note: |
      判定役が前回と同じ指摘を返した。直す役は毎回直しているので、直っていないのではなく
      規則の読み方が食い違っている。回数を使い切るまで往復しても同じなので、この観点に
      入る前の本文に戻し、合わなかったことを報告に残して次へ進む
      (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: sameAsLast
        arguments: ["verdict", "last-verdict-1"]
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-1", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点1 problemdef | " + state.getString("verdict")'}
        execution: direct

  - states: ["check-1", "fix-1"]
    label: needs-fix-1
    note: 満たしていない。直す回数が残っていれば直しへ。
    actions: [{actor: this, method: countUp, arguments: ["tries-1", 'jexl:state.getString("tries")'], execution: direct}]

  - states: ["check-1", "enter-2"]
    label: give-up-1
    note: |
      直す回数を使い切った。この観点に入る前の本文に戻して次の観点へ進む。満たせなかった観点の
      書き換えを残すと、いじり回しただけの本文になる。
    actions:
      - actor: this
        method: copyState
        arguments: ["kept-1", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点1 problemdef | 回数を使い切った: " + state.getString("verdict")'}
        execution: direct

  - states: ["fix-1", "judge-1"]
    label: fix-1-problemdef
    note: 会話がファイルを直し、書き戻したものをこの計画が読み取る。
    actions:
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["fixer", 'jexl:"規則の文書と本文は、それぞれ別のファイルにある。read ツールを1回に1つのパスで2回呼び、規則を読んでから本文を読むこと。2つのパスを1回の read にまとめないこと。指摘された点を直し、write ツールで本文のファイルに同じパスで書き戻すこと。直した本文を返事に書かなくてよい。書き戻したら「done」とだけ返す。本文にある事実・数値・コマンド・識別子は書き換えないでください。節を足す必要があるときは、元の本文にある事実だけを使って書いてください。他の文書から文をそのまま持ち込まないでください。他の文書にある説明は、その文書を参照する一文で足ります。確かめていないコマンド・実行結果・設定値を書かないでください。本文の文体を変えないでください。ですます体で書かれていればですます体のまま、である体で書かれていればである体のまま直してください。規則の文書の文体に合わせないでください。実体に名前を与えるときは、短い名詞句にしてください。説明文をそのまま名前にしないでください。名前を置き換えたら、表の列や本文が読めるかを確かめてください。\n\n規則: /home/devteam/works/doc_Base010/docs/ProjectStandard2/030_ProgrammingProject/200_documentation/100_AntiPattern/020_AntiPatternProblemDefinition_260922_oo01/020_AntiPatternProblemDefinition_260922_oo01.md\n本文: " + state.getString("work") + "\n\n指摘:\n" + state.getString("verdict")']
        execution: direct
      - actor: this
        method: readFile
        arguments: ['jexl:state.getString("work")', "text"]
        execution: direct

  - states: ["fix-1", "enter-2"]
    label: fixer-did-not-answer-1
    note: |
      直す役が答えなかった。待つのをやめた側が、相手の仕事も止める。この観点は諦めて
      入る前の本文に戻し、次の観点へ進む。受け皿が無いと、会話ひとつの不調で実行全体が
      「一致する遷移が無い」で終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("fixer")']
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-1", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点1 problemdef | 直す役が答えなかった"'}
        execution: direct

  # ── 2. howto ───────────────────────────────────────────────────────────
  - states: ["enter-2", "judge-2"]
    label: enter-2-howto
    note: |
      規則は 025_AntiPatternHowToDoIt_260922_oo01.md にある。会話がそれを読む。
      いまの本文を控え、会話が読み書きするファイルへ置く。ここではまだ本文を書き換えない。
    actions:
      - actor: this
        method: copyState
        arguments: ["text", "kept-2"]
        execution: direct
      - actor: this
        method: writeFile
        arguments: ['jexl:state.getString("work")', "text"]
        execution: direct

  - states: ["judge-2", "check-2"]
    label: judge-2-howto
    note: 本文がこの規則を満たしているかを見る。満たしていれば本文には触れない。
    actions:
      - actor: this
        method: clearWorker
        arguments: ["judge"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["judge", 'jexl:"規則の文書と本文は、それぞれ別のファイルにある。read ツールを1回に1つのパスで2回呼び、規則を読んでから本文を読むこと。2つのパスを1回の read にまとめないこと。本文がこの規則を満たしているかだけを見る。規則のうち、この本文に当てはまる項目だけで判断する。本文に無い事柄が書かれていないことを理由に REVISE と判断しない。満たしていれば ACCEPT の一語だけを返す。満たしていなければ REVISE: に続けて、満たしていない箇所を具体的に挙げる。ほかのことは書かない。\n\n規則: /home/devteam/works/doc_Base010/docs/ProjectStandard2/030_ProgrammingProject/200_documentation/100_AntiPattern/025_AntiPatternHowToDoIt_260922_oo01/025_AntiPatternHowToDoIt_260922_oo01.md\n本文: " + state.getString("work")']
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["judge", "verdict"]
        execution: direct

  - states: ["judge-2", "enter-3"]
    label: judge-did-not-answer-2
    note: |
      judge が答えなかった。待つのをやめた側が相手の仕事も止め、本文を戻して先へ進む。
      受け皿が無いと、会話ひとつの不調で実行全体が終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("judge")']
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-2", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点2 howto | 判定役が答えなかった"'}
        execution: direct

  - states: ["check-2", "enter-3"]
    label: accept-2
    note: 満たしている。本文はそのまま次の規則へ。
    actions: [{actor: this, method: checkState, arguments: ["verdict", "ACCEPT"], execution: direct}]

  - states: ["check-2", "enter-3"]
    label: no-agreement-2
    note: |
      判定役が前回と同じ指摘を返した。直す役は毎回直しているので、直っていないのではなく
      規則の読み方が食い違っている。回数を使い切るまで往復しても同じなので、この観点に
      入る前の本文に戻し、合わなかったことを報告に残して次へ進む
      (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: sameAsLast
        arguments: ["verdict", "last-verdict-2"]
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-2", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点2 howto | " + state.getString("verdict")'}
        execution: direct

  - states: ["check-2", "fix-2"]
    label: needs-fix-2
    note: 満たしていない。直す回数が残っていれば直しへ。
    actions: [{actor: this, method: countUp, arguments: ["tries-2", 'jexl:state.getString("tries")'], execution: direct}]

  - states: ["check-2", "enter-3"]
    label: give-up-2
    note: |
      直す回数を使い切った。この観点に入る前の本文に戻して次の観点へ進む。満たせなかった観点の
      書き換えを残すと、いじり回しただけの本文になる。
    actions:
      - actor: this
        method: copyState
        arguments: ["kept-2", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点2 howto | 回数を使い切った: " + state.getString("verdict")'}
        execution: direct

  - states: ["fix-2", "judge-2"]
    label: fix-2-howto
    note: 会話がファイルを直し、書き戻したものをこの計画が読み取る。
    actions:
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["fixer", 'jexl:"規則の文書と本文は、それぞれ別のファイルにある。read ツールを1回に1つのパスで2回呼び、規則を読んでから本文を読むこと。2つのパスを1回の read にまとめないこと。指摘された点を直し、write ツールで本文のファイルに同じパスで書き戻すこと。直した本文を返事に書かなくてよい。書き戻したら「done」とだけ返す。本文にある事実・数値・コマンド・識別子は書き換えないでください。節を足す必要があるときは、元の本文にある事実だけを使って書いてください。他の文書から文をそのまま持ち込まないでください。他の文書にある説明は、その文書を参照する一文で足ります。確かめていないコマンド・実行結果・設定値を書かないでください。本文の文体を変えないでください。ですます体で書かれていればですます体のまま、である体で書かれていればである体のまま直してください。規則の文書の文体に合わせないでください。実体に名前を与えるときは、短い名詞句にしてください。説明文をそのまま名前にしないでください。名前を置き換えたら、表の列や本文が読めるかを確かめてください。\n\n規則: /home/devteam/works/doc_Base010/docs/ProjectStandard2/030_ProgrammingProject/200_documentation/100_AntiPattern/025_AntiPatternHowToDoIt_260922_oo01/025_AntiPatternHowToDoIt_260922_oo01.md\n本文: " + state.getString("work") + "\n\n指摘:\n" + state.getString("verdict")']
        execution: direct
      - actor: this
        method: readFile
        arguments: ['jexl:state.getString("work")', "text"]
        execution: direct

  - states: ["fix-2", "enter-3"]
    label: fixer-did-not-answer-2
    note: |
      直す役が答えなかった。待つのをやめた側が、相手の仕事も止める。この観点は諦めて
      入る前の本文に戻し、次の観点へ進む。受け皿が無いと、会話ひとつの不調で実行全体が
      「一致する遷移が無い」で終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("fixer")']
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-2", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点2 howto | 直す役が答えなかった"'}
        execution: direct

  # ── 3. oneaxis ───────────────────────────────────────────────────────────
  - states: ["enter-3", "judge-3"]
    label: enter-3-oneaxis
    note: |
