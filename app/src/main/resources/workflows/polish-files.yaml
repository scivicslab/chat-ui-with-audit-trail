  # ── last: nothing brought in, nothing altered ─────────────────────────────
  - states: ["verify", "verify-check"]
    label: verify-nothing-was-brought-in
    note: |
      Compares the text as it arrived with the text as it stands, by comparing rather than by
      asking. A judge given both texts answered ACCEPT for nine documents of nine, one of which
      had had a YAML block rewritten into something that does not run
      (WhatAProgramCanDo_260915_oo01).
    actions:
      - actor: this
        method: compareTexts
        arguments: ["original", "text", "verdict"]
        execution: direct

  - states: ["verify-check", "write"]
    label: accept-verify
    actions: [{actor: this, method: checkState, arguments: ["verdict", "ACCEPT"], execution: direct}]

  - states: ["verify-check", "verify-fix"]
    label: needs-verify-fix
    actions: [{actor: this, method: countUp, arguments: ["tries-verify", 'jexl:state.getString("tries")'], execution: direct}]

  - states: ["verify-check", "skip"]
    label: give-up-verify
    note: |
      The last check could not be passed. This file is not written: what cannot be shown to be
      unbroken does not replace what is there. The original stays as it is, and the job says so.
    actions: [{actor: this, method: doNothing, arguments: ["not written"], execution: direct}]

  - states: ["verify-fix", "verify"]
    label: take-back-what-was-brought-in
    actions:
      - actor: this
        method: askWorker
        arguments: ["fixer", 'jexl:"規則の文書と本文は、それぞれファイルにある。read ツールで両方を読んでから答えること。指摘された箇所だけを直し、write ツールで直した本文のファイルに同じパスで書き戻すこと。元の本文に無いコマンド・実行結果・数値は消す。元の本文にあった数値・コマンド・識別子が書き換えられていれば、元の値に戻す。それ以外は今のままにする。書き戻したら「done」とだけ返す。\n\n元の本文: " + state.getString("orig") + "\n直した本文: " + state.getString("work") + "\n\n指摘:\n" + state.getString("verdict")']
        execution: direct
      - actor: this
        method: readFile
        arguments: ['jexl:state.getString("work")', "text"]
        execution: direct

  - states: ["write", "next"]
    label: write-result
    actions:
      - actor: this
        method: joinFrontMatter
        arguments: ["head", "text", "whole"]
        execution: direct
      - actor: this
        method: writeFile
        arguments: ['jexl:state.getString("outDir") + "/" + state.getString("file").substring(state.getString("file").lastIndexOf("/") + 1)', "whole"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: done, value: 'jexl:"written: " + state.getString("file")'}
        execution: direct

  - states: ["skip", "next"]
    label: leave-the-original-alone
    note: |
      The last check could not be passed within its allowance, so nothing is written for this file
      and the job says which one it was.
    actions:
      - actor: this
        method: appendJson
        arguments: {path: done, value: 'jexl:"not written (the last check did not pass): " + state.getString("file")'}
        execution: direct
