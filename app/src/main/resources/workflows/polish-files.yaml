    actions:
      - actor: this
        method: copyState
        arguments: ["text", "before"]
        execution: direct
      - actor: this
        method: writeFile
        arguments: ['jexl:state.getString("before-path")', "before"]
        execution: direct
      - actor: this
        method: copyState
        arguments: ["text", "kept-3"]
        execution: direct
      - actor: this
        method: writeFile
