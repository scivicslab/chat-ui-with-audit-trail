name: fill-frame
description: |
  Fills a frame with a writer conversation, one blank at a time (WorkflowFromFrame_261020_oo01).
  The request is a rule file whose rules carry :instruction (what to write) and, where it helps,
  :sample (a model sentence from another document). A blank that also carries :kind code-block is
  answered with code alone, which is kept in a file beside `out` and shown as a code block. A blank
  that carries :kind bullet or :kind number is answered with the items, one per line. A blank that
  carries :include "file.lisp" is replaced, without a question, by one copy of that child frame. A rule
  that also carries :frame "file.lisp"
  is a list: the writer names the items, each item gets a copy of that sub-frame's rules, and the
  copies' blanks are filled in turn. Each blank is one question to the writer, and the question
  carries what it follows on from: the sentences already written for the same item, or in the same
  paragraph. A sentence blank is also shown, besides its :sample, up to maxExamples paragraphs of the
  source books that play the same part, found through the frame library's roles tables and made-from
  lines (FramesAndSamplesFromBooks_261021_oo01). The writer is put on plain-text-no-context-loop.yaml, which sends that question and
  nothing else: no tool instructions, no skill catalog, none of the run's earlier questions and
  answers (with them, the model wrote broken text such as "<integer> </integer>"). The finished
  rule file is written to `out`.
params:
  request:
    label: "The request rule file"
    description: "Absolute path of the rule file whose blanks are to be filled"
    type: text
    required: true
  subject:
    label: "The material to explain"
    description: "Absolute path of the file the writer is shown with every question, e.g. the program being explained"
    type: text
    required: true
  frameDir:
    label: "The directory of the sub-frames"
    description: "Absolute path of the directory holding the files a :frame names"
    type: text
    required: true
  out:
    label: "Where to write the filled rule file"
    description: "Absolute path"
    type: text
    required: true
  writer:
    description: "The conversation that writes"
    default: "project1/chat-02"
  writerModel:
    description: "The model the writer runs on; empty leaves the conversation as it is"
    default: ""
  writerNoThink:
    description: "true asks the writer's model to skip its thinking phase"
    default: "true"
  language:
    description: "The language the writer writes in"
    default: "Japanese"
  maxItems:
    description: "How many items a list may have at most"
    type: int
    default: 5
  framesRoot:
    description: "The frame library's frames/ directory, read for the roles tables and made-from lines that give each blank its examples; empty takes the parent of frameDir when it is named frames"
    default: ""
  works:
    description: "The directory the books' paths are under; empty takes ~/works"
    default: ""
  maxExamples:
    description: "How many paragraphs of the source books a sentence blank is shown at most, besides its :sample"
    type: int
    default: 3
  maxBlanks:
    description: "How many blanks one run fills at most; the run fails past it"
    type: int
    default: 80
steps:
  - states: ["0", "1"]
    label: add-writer
    note: The writer is a conversation with no history of its own from before, on the loop that sends only the question.
    actions:
      - actor: loader
        method: createChild
        arguments: ['jexl:self', "./filler", "com.scivicslab.turingworkflow.plugins.rstframe.FrameFillingIIAR"]
      - actor: this
        method: putJson
        arguments: {path: 'chat-writer', value: 'jexl:state.getString("writer")'}
        execution: direct
      - actor: chats
        method: setAgentLoop
        arguments: {chat: 'jexl:state.getString("writer")', loop: 'plain-text-no-context-loop.yaml'}
        execution: direct
      - actor: chats
        method: setModel
        arguments: {chat: 'jexl:state.getString("writer")', model: 'jexl:state.getString("writerModel")'}
        execution: direct
      - actor: chats
        method: setNoThink
        arguments: {chat: 'jexl:state.getString("writer")', value: 'jexl:state.getString("writerNoThink")'}
        execution: direct
      - actor: chats
        method: clear
        arguments: {chat: 'jexl:state.getString("chat-writer")'}
        execution: direct

  - states: ["1", "pick"]
    label: read-the-files
    actions:
      - actor: this
        method: putJson
        arguments: {path: done, value: "0"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: names, value: ""}
        execution: direct
      - actor: files
        method: read
        arguments: {path: 'jexl:state.getString("request")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: "cur", value: "jexl:result"}
        execution: direct
      - actor: files
        method: read
        arguments: {path: 'jexl:state.getString("subject")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: "subject", value: "jexl:result"}
        execution: direct

  - states: ["1", "failed"]
    label: no-input-file
    actions: [{actor: this, method: doNothing, arguments: ["the request or the subject could not be read"], execution: direct}]

  - states: ["pick", "install"]
    label: no-blank-left
    note: |
      Reached only when no rule carries an :instruction any more. The file is searched for the
      marker, so a run that stopped for another reason is not installed as if it were finished.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("cur").indexOf(":instruction \"") < 0'
        execution: direct

  - states: ["pick", "pick"]
    label: include-a-child-frame
    note: A blank with :include is one child frame, put in once as it is from frameDir; nothing is asked, and its own blanks come next.
    actions:
      - actor: ./filler
        method: next
        arguments: {file: 'jexl:state.getString("cur")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: blank, value: "jexl:result"}
        execution: direct
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("blank.kind") == "include"'
        execution: direct
      - actor: files
        method: read
        arguments: {path: 'jexl:state.getString("frameDir") + "/" + state.getString("blank.include")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: "frame-text", value: "jexl:result"}
        execution: direct
      - actor: ./filler
        method: include
        arguments: {file: 'jexl:state.getString("cur")', frameText: 'jexl:state.getString("frame-text")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: cur, value: "jexl:result"}
        execution: direct

  - states: ["pick", "ask"]
    label: next-blank
    note: Takes the next blank of the rule file as it stands. countUp bounds the run.
    actions:
      - actor: ./filler
        method: next
        arguments: {file: 'jexl:state.getString("cur")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: blank, value: "jexl:result"}
        execution: direct
      - actor: this
        method: countUp
        arguments: ["done", 'jexl:state.getString("maxBlanks")']
        execution: direct
      - actor: ./filler
        method: examples
        arguments: {request: 'jexl:state.getString("request")', framesRoot: 'jexl:state.getString("framesRoot")', frameDir: 'jexl:state.getString("frameDir")', works: 'jexl:state.getString("works")', max: 'jexl:state.getString("maxExamples")'}
        execution: direct
      - actor: ./filler
        method: prompt
        arguments: {file: 'jexl:state.getString("cur")', subject: 'jexl:state.getString("subject")', names: 'jexl:state.getString("names")', language: 'jexl:state.getString("language")', maxItems: 'jexl:state.getString("maxItems")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: prompt, value: "jexl:result"}
        execution: direct

  - states: ["pick", "failed"]
    label: could-not-take-the-next-blank
    note: A blank is left but it could not be taken or asked about, or maxBlanks was passed.
    actions: [{actor: this, method: doNothing, arguments: ["the next blank could not be taken, or maxBlanks was passed"], execution: direct}]

  - states: ["ask", "keep"]
    label: ask-the-writer
    actions:
      - actor: chats
        method: ask
        arguments: {chat: 'jexl:state.getString("chat-writer")', prompt: 'jexl:state.getString("prompt")', waiter: 'jexl:self'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: 'reply-writer', value: 'jexl:result'}
        execution: direct

  - states: ["ask", "failed"]
    label: writer-gave-no-answer
    actions: [{actor: this, method: doNothing, arguments: ["the writer gave no answer"], execution: direct}]

  - states: ["keep", "pick"]
    label: expand-the-list
    note: A frame blank. The sub-frame's text is read from frameDir, and the rule file now holds one copy per item.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("blank.kind") == "frame"'
        execution: direct
      - actor: this
        method: copyState
        arguments: ['reply-writer', 'reply']
        execution: direct
      - actor: files
        method: read
        arguments: {path: 'jexl:state.getString("frameDir") + "/" + state.getString("blank.frame")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: "frame-text", value: "jexl:result"}
        execution: direct
      - actor: ./filler
        method: expand
        arguments: {file: 'jexl:state.getString("cur")', frameText: 'jexl:state.getString("frame-text")', reply: 'jexl:state.getString("reply")', maxItems: 'jexl:state.getString("maxItems")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: expanded, value: "jexl:result"}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: cur, value: 'jexl:state.getString("expanded.file")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: names, value: 'jexl:state.getString("expanded.names")'}
        execution: direct

  - states: ["keep", "pick"]
    label: write-the-code
    note: A code blank (:kind code-block). The code goes into a file beside `out`, and the rule names that file.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("blank.kind") == "code"'
        execution: direct
      - actor: this
        method: copyState
        arguments: ['reply-writer', 'reply']
        execution: direct
      - actor: ./filler
        method: fillCode
        arguments: {file: 'jexl:state.getString("cur")', reply: 'jexl:state.getString("reply")', out: 'jexl:state.getString("out")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: coded, value: "jexl:result"}
        execution: direct
      - actor: files
        method: write
        arguments: {path: 'jexl:state.getString("coded.path")', text: 'jexl:state.getString("coded.code")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: cur, value: 'jexl:state.getString("coded.file")'}
        execution: direct

  - states: ["keep", "pick"]
    label: write-the-items
    note: A bulleted or numbered list blank (:kind bullet or number). Each line of the reply becomes one item.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("blank.kind") == "items"'
        execution: direct
      - actor: this
        method: copyState
        arguments: ['reply-writer', 'reply']
        execution: direct
      - actor: ./filler
        method: fillItems
        arguments: {file: 'jexl:state.getString("cur")', reply: 'jexl:state.getString("reply")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: cur, value: "jexl:result"}
        execution: direct

  - states: ["keep", "pick"]
    label: write-the-sentence
    note: A sentence blank. The guard keeps a list blank whose expansion failed from being filled with the list text.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("blank.kind") == "sentence"'
        execution: direct
      - actor: this
        method: copyState
        arguments: ['reply-writer', 'reply']
        execution: direct
      - actor: ./filler
        method: fill
        arguments: {file: 'jexl:state.getString("cur")', reply: 'jexl:state.getString("reply")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: cur, value: "jexl:result"}
        execution: direct

  - states: ["keep", "failed"]
    label: could-not-keep-the-reply
    actions: [{actor: this, method: doNothing, arguments: ["the reply could not be written into the rule file"], execution: direct}]

  - states: ["install", "end"]
    label: install
    note: The finished rule file is written where the request said. make-markdown (or html-saurus's Rebuild) writes the markdown from it, or reports the violations.
    actions:
      - actor: files
        method: write
        arguments: {path: 'jexl:state.getString("out")', text: 'jexl:state.getString("cur")'}
        execution: direct
      - actor: loader
        method: removeChild
        arguments: ['jexl:self', "./filler"]
      - actor: this
        method: finish
        arguments: ["out"]
        execution: direct

  - states: ["failed", "end"]
    label: report-failure
    actions:
      - actor: loader
        method: removeChild
        arguments: ['jexl:self', "./filler"]
      - actor: this
        method: reportFailure
        arguments: []
        execution: direct

