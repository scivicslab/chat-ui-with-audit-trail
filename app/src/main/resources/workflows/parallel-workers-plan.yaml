name: parallel-workers-plan
description: |
  Fans one question out to several conversations at once and gathers their replies
  (ParallelWorkerPool_260829_oo01). chats.askAll asks every conversation named, one per line, at
  the same time and waits for all of them, so the whole fan-out costs about as long as its slowest
  conversation rather than the sum. A conversation that fails does not stop the others: its reply
  is left out, and the step fails only when none replied.

  Run this as a project job (Run tab), editing the conversations and the question to suit.
  The first state must be named "0".

steps:
  - states: ["0", "1"]
    label: name-the-conversations
    note: The conversations the question goes to, one full name per line.
    actions:
      - actor: this
        method: putJson
        arguments: {path: conversations, value: "project1/chat-02\nproject1/chat-03"}
        execution: direct

  - states: ["1", "2"]
    label: ask-all-at-once
    actions:
      - actor: chats
        method: askAll
        arguments:
          chats: 'jexl:state.getString("conversations")'
          prompt: "Explain, in about 80 words, what makes actor-model concurrency different from locks."
          waiter: 'jexl:self'
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: replies, value: "jexl:result"}
        execution: direct

  - states: ["1", "end"]
    label: nobody-replied
    actions: [{actor: this, method: reportFailure, execution: direct}]

  - states: ["2", "end"]
    label: done
    actions: [{actor: this, method: finish, arguments: ["replies"], execution: direct}]
