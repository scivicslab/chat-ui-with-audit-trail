name: abstract-roles
description: |
  Assigns each paragraph of one book to what can be said of its concept's class (FrameMakingWorkflow_261022_oo01,
  step 3; ConceptClasses_261022_oo01). The concepts and their paragraphs come from the concept tree that
  concept-tree.yaml wrote. Concept classes are CLOS classes read from rst-on-lisp/concepts/; every lookup in the
  class tree is done by the program, and the writer only judges what it is shown. For one concept: where it is
  (the class of its name, or taken down from the root classes; a general kind named by the writer when none fits),
  then for each paragraph which inherited question it answers, or a new one, or aside, and for a new question how
  far up the class tree it reaches. Classes and slots added are proposals, written with the assignments; whether
  they join rst-on-lisp/concepts/ is decided by a person. The writer is put on plain-text-no-context-loop.yaml, so
  each question is sent alone.
params:
  book:
    label: "The book's directory"
    description: "Absolute path; every .lisp under it with its .md beside it is read, e.g. .../Papers-AgentHarness/claude-agent-loop"
    type: text
    required: true
  name:
    label: "The book's name"
    description: "Lower-case words joined by '-', e.g. claude-agent-loop"
    type: text
    required: true
  tree:
    label: "The concept tree"
    description: "Absolute path of the subjects file concept-tree.yaml wrote for this book"
    type: text
    required: true
  classes:
    label: "The concept classes"
    description: "Absolute path of the directory of class files, e.g. .../rst-on-lisp/concepts; empty starts with no class"
    type: text
    default: ""
  out:
    label: "Where to write the assignments"
    description: "Absolute path of the result file, e.g. .../rst-on-lisp/assignments/claude-agent-loop.lisp, where the frame viewer's Classes tab reads it; an existing file is not overwritten"
    type: text
    required: true
  writer:
    description: "The conversation that answers the questions"
    default: "project1/chat-02"
  writerModel:
    description: "The model the writer runs on; empty leaves the conversation as it is"
    default: ""
  writerNoThink:
    description: "true asks the writer's model to skip its thinking phase"
    default: "true"
  maxQuestions:
    description: "How many questions one run asks at most; the run fails past it"
    type: int
    default: 600
steps:
  - states: ["0", "1"]
    label: add-writer
    note: The writer is a conversation with no history of its own from before, on the loop that sends each question alone.
    actions:
      - actor: loader
        method: createChild
        arguments: ["ROOT", "slots", "com.scivicslab.turingworkflow.plugins.rstframe.SlotsJobIIAR"]
      - actor: this
        method: addWorker
        arguments: ["writer", 'jexl:state.getString("writer")']
        execution: direct
      - actor: this
        method: setChatAgentLoop
        arguments: ['jexl:state.getString("writer")', "plain-text-no-context-loop.yaml"]
        execution: direct
      - actor: this
        method: setChatModel
        arguments: ['jexl:state.getString("writer")', 'jexl:state.getString("writerModel")']
        execution: direct
      - actor: this
        method: setChatNoThink
        arguments: ['jexl:state.getString("writer")', 'jexl:state.getString("writerNoThink")']
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["writer"]
        execution: direct

  - states: ["1", "next"]
    label: open-the-book
    actions:
      - actor: this
        method: putJson
        arguments: {path: asked, value: "0"}
        execution: direct
      - actor: slots
        method: open
        arguments: {book: 'jexl:state.getString("book")', name: 'jexl:state.getString("name")', tree: 'jexl:state.getString("tree")', classes: 'jexl:state.getString("classes")'}
        execution: direct

  - states: ["1", "failed"]
    label: no-rule-file
    actions: [{actor: this, method: doNothing, arguments: ["the book's directory, its concept tree or the class files could not be read"], execution: direct}]

  - states: ["next", "decide"]
    label: take-the-next-question
    actions:
      - actor: slots
        method: question
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: q, value: "jexl:result"}
        execution: direct

  - states: ["decide", "write"]
    label: no-question-left
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("q.done") == "true"'
        execution: direct

  - states: ["decide", "ask"]
    label: a-question-is-left
    note: countUp bounds the run.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("q.done") == "false"'
        execution: direct
      - actor: this
        method: countUp
        arguments: ["asked", 'jexl:state.getString("maxQuestions")']
        execution: direct

  - states: ["decide", "failed"]
    label: too-many-questions
    actions: [{actor: this, method: doNothing, arguments: ["maxQuestions was passed"], execution: direct}]

  - states: ["ask", "next"]
    label: ask-the-writer
    actions:
      - actor: this
        method: askWorker
        arguments:
          - writer
          - 'jexl:state.getString("q.question")'
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["writer", "reply"]
        execution: direct
      - actor: slots
        method: answer
        arguments: {reply: 'jexl:state.getString("reply")'}
        execution: direct

  - states: ["ask", "failed"]
    label: writer-gave-no-answer
    actions: [{actor: this, method: doNothing, arguments: ["the writer gave no answer"], execution: direct}]

  - states: ["write", "end"]
    label: write-the-assignments
    note: The classes added or grown and the assignments are written, never over a file already there.
    actions:
      - actor: slots
        method: write
        arguments: {out: 'jexl:state.getString("out")', tree: 'jexl:state.getString("tree")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: outcome, value: "jexl:result"}
        execution: direct
      - actor: loader
        method: removeChild
        arguments: "slots"
      - actor: this
        method: finish
        arguments: ["outcome"]
        execution: direct

  - states: ["write", "failed"]
    label: could-not-write
    actions: [{actor: this, method: doNothing, arguments: ["the assignments could not be written, or the file is already there"], execution: direct}]

  - states: ["failed", "end"]
    label: report-failure
    actions:
      - actor: loader
        method: removeChild
        arguments: "slots"
      - actor: this
        method: reportFailure
        arguments: []
        execution: direct
