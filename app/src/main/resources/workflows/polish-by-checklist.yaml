  - states: ["enter-1", "judge-1"]
    label: enter-1-problemdef
    note: |
      規則は 020_AntiPatternProblemDefinition_260922_oo01.md にある。
      規則を読み、いまの本文を控える。ここではまだ本文を書き換えない。
    actions:
      - actor: this
        method: readFile
        arguments: ["/home/devteam/works/doc_Base010/docs/ProjectStandard2/030_ProgrammingProject/200_documentation/100_AntiPattern/020_AntiPatternProblemDefinition_260922_oo01/020_AntiPatternProblemDefinition_260922_oo01.md", "rule-1"]
        execution: direct
      - actor: this
        method: copyState
        arguments: ["text", "kept-1"]
        execution: direct

  - states: ["judge-1", "check-1"]
    label: judge-1-problemdef
    note: 本文がこの規則を満たしているかを見る。満たしていれば本文には触れない。
    actions:
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["judge"]
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["judge"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["judge", 'jexl:"次の本文が、この規則を満たしているかだけを見てください。規則のうち、この本文に当てはまる項目だけで判断してください。本文に無い事柄が書かれていないことを理由に REVISE と判断しないでください。満たしていれば ACCEPT の一語だけを返してください。満たしていなければ REVISE: に続けて、満たしていない箇所を具体的に挙げてください。ほかのことは書かないでください。\n\n規則:\n" + state.getString("rule-1") + "\n\n本文:\n" + state.getString("text")']
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["judge", "verdict"]
        execution: direct

  - states: ["judge-1", "enter-2"]
    label: judge-did-not-answer-1
    note: |
      judge が答えなかった。待つのをやめた側が相手の仕事も止め、本文を戻して先へ進む。
      受け皿が無いと、会話ひとつの不調で実行全体が終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("judge")']
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-1", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点1 problemdef | 判定役が答えなかった"'}
        execution: direct

  - states: ["check-1", "enter-2"]
    label: accept-1
    note: 満たしている。本文はそのまま次の規則へ。
    actions: [{actor: this, method: checkState, arguments: ["verdict", "ACCEPT"], execution: direct}]

  - states: ["check-1", "fix-1"]
    label: needs-fix-1
    note: 満たしていない。直す回数が残っていれば直しへ。
    actions: [{actor: this, method: countUp, arguments: ["tries-1", 'jexl:state.getString("tries")'], execution: direct}]

  - states: ["check-1", "enter-2"]
    label: give-up-1
    note: |
      直す回数を使い切った。この観点に入る前の本文に戻して次の観点へ進む。満たせなかった観点の
      書き換えを残すと、いじり回しただけの本文になる。
    actions: [{actor: this, method: copyState, arguments: ["kept-1", "text"], execution: direct}]

  - states: ["fix-1", "judge-1"]
    label: fix-1-problemdef
    actions:
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["judge"]
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["fixer", 'jexl:"指摘を受けました。同じ規則のまま直してください。直した本文だけを返してください。本文にある事実・数値・コマンド・識別子は書き換えないでください。節を足す必要があるときは、元の本文にある事実だけを使って書いてください。他の文書から文をそのまま持ち込まないでください。他の文書にある説明は、その文書を参照する一文で足ります。確かめていないコマンド・実行結果・設定値を書かないでください。本文の文体を変えないでください。ですます体で書かれていればですます体のまま、である体で書かれていればである体のまま直してください。規則の文書の文体に合わせないでください。実体に名前を与えるときは、短い名詞句にしてください。説明文をそのまま名前にしないでください。名前を置き換えたら、表の列や本文が読めるかを確かめてください。\n\n規則:\n" + state.getString("rule-1") + "\n\n指摘:\n" + state.getString("verdict") + "\n\n本文:\n" + state.getString("text")']
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["fixer", "text"]
        execution: direct

  - states: ["fix-1", "enter-2"]
