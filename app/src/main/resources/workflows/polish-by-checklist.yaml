        arguments: ["fixer", 'jexl:"指摘を受けました。同じ規則のまま直してください。直した本文だけを返してください。指摘が「削りすぎ」であれば、消えた事実を元の本文から取り戻し、本文か「## 雑記」の節に書き戻してください。本文にある事実・数値・コマンド・識別子は書き換えないでください。節を足す必要があるときは、元の本文にある事実だけを使って書いてください。他の文書から文をそのまま持ち込まないでください。他の文書にある説明は、その文書を参照する一文で足ります。確かめていないコマンド・実行結果・設定値を書かないでください。本文の文体を変えないでください。ですます体で書かれていればですます体のまま、である体で書かれていればである体のまま直してください。規則の文書の文体に合わせないでください。実体に名前を与えるときは、短い名詞句にしてください。説明文をそのまま名前にしないでください。名前を置き換えたら、表の列や本文が読めるかを確かめてください。事実を削らないでください。筋から外れると判断した事実は、本文から外したうえで、末尾の「## 雑記」の節に箇条書きで移してください（順不同でかまいません）。「## 参考資料」の節があれば、その直前に「## 雑記」を置いてください。\n\n規則:\n" + state.getString("rule-7") + "\n\n指摘:\n" + state.getString("verdict") + "\n\n元の本文（ここにある事実は全部残すこと）:\n" + state.getString("before") + "\n\nいまの本文:\n" + state.getString("text")']
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["fixer", "text"]
        execution: direct

  - states: ["fix-7", "verify"]
    label: fixer-did-not-answer-7
    note: |
      fixer が答えなかった。待つのをやめた側が相手の仕事も止め、本文を戻して先へ進む。
      受け皿が無いと、会話ひとつの不調で実行全体が終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("fixer")']
        execution: direct
      - actor: this
        method: copyState
        arguments: ["kept-7", "text"]
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 観点7 redundancy | 直す役が答えなかった"'}
        execution: direct

  # ── last: nothing brought in, nothing altered ─────────────────────────────
  - states: ["verify", "verify-check"]
    label: verify-nothing-was-brought-in
    note: 受け取ったときの本文と見比べ、コマンド・名前・数値が変わっていないかを照合する。
    actions:
      - actor: this
        method: compareTexts
        arguments: ["original", "text", "verdict"]
        execution: direct

  - states: ["verify-check", "done"]
    label: accept-verify
    actions: [{actor: this, method: checkState, arguments: ["verdict", "ACCEPT"], execution: direct}]

  - states: ["verify-check", "verify-fix"]
    label: needs-verify-fix
    actions: [{actor: this, method: countUp, arguments: ["tries-verify", 'jexl:state.getString("tries")'], execution: direct}]

  - states: ["verify-check", "skip"]
    label: give-up-verify
    note: |
      照合を通せなかった。壊していないと示せないものを、元と置き換えない。
    actions: [{actor: this, method: doNothing, arguments: ["not written"], execution: direct}]

  - states: ["verify-fix", "verify"]
    label: take-back-what-was-brought-in
    actions:
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["judge"]
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["fixer"]
        execution: direct
      - actor: this
        method: askWorker
        arguments: ["fixer", 'jexl:"指摘を受けました。指摘された箇所だけを直してください。直した本文だけを返してください。元の本文に無いコマンド・実行結果・数値は消してください。他の文書にある説明をそのまま持ち込んでいる箇所は、その文書を参照する一文に置き換えてください。元の本文にあった数値・コマンド・識別子が書き換えられていれば、元の値に戻してください。それ以外は今の本文のままにしてください。\n\n指摘:\n" + state.getString("verdict") + "\n\n元の本文:\n" + state.getString("original") + "\n\nいまの本文:\n" + state.getString("text")']
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["fixer", "text"]
        execution: direct

  - states: ["verify-fix", "skip"]
    label: verify-fixer-did-not-answer
    note: |
      fixer が答えなかった。待つのをやめた側が相手の仕事も止め、本文を戻して先へ進む。
      受け皿が無いと、会話ひとつの不調で実行全体が終わる (WhenTheTwoRolesDoNotAgree_260915_oo01)。
    actions:
      - actor: this
        method: stopChat
        arguments: ['jexl:state.getString("fixer")']
        execution: direct
      - actor: this
        method: appendJson
        arguments: {path: disagreements, value: 'jexl:state.getString("file") + " | 最後の照合の直しに答えなかった"'}
        execution: direct

  - states: ["done", "end"]
    label: done
    actions: [{actor: this, method: finish, arguments: ["text"], execution: direct}]

  - states: ["skip", "end"]
    label: the-last-check-did-not-pass
    actions: [{actor: this, method: finish, arguments: ["text"], execution: direct}]

  - states: ["!end", "end"]
    label: catch-all
    note: どの遷移も通らなかった。いまの本文を返して終える。
    actions: [{actor: this, method: finish, arguments: ["text"], execution: direct}]
