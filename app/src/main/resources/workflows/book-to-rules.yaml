name: book-to-rules
description: |
  Makes every markdown file of a book into an rst-on-lisp rule file written beside it
  (FrameMakingWorkflow_261022_oo01, step 1). The sentences are the book's own; for each paragraph the
  writer is asked two questions: its OCR misreadings, then which sentence is the nucleus and by which
  relation each other sentence joins it. Each heading starts a section; code and formulas are kept as
  files beside the rule file. Files that already have a rule file are skipped, so a stopped run can be
  started again and goes on where it stopped. The writer is put on plain-text-no-context-loop.yaml, so
  each question is sent alone.
params:
  book:
    label: "The book's directory"
    description: "Absolute path; every .md under it without a .lisp beside it is made into one, e.g. .../Books-Programming/CoreJava14th_Vol1"
    type: text
    required: true
  writer:
    description: "The conversation that answers the questions"
    default: "project1/chat-02"
  writerModel:
    description: "The model the writer runs on; empty leaves the conversation as it is"
    default: "google/gemma-4-26B-A4B-it"
  writerNoThink:
    description: "true asks the writer's model to skip its thinking phase"
    default: "true"
  maxQuestions:
    description: "How many questions one run asks at most, over all files; the run fails past it"
    type: int
    default: 100000
steps:
  - states: ["0", "1"]
    label: add-writer
    note: The writer is a conversation with no history of its own from before, on the loop that sends each question alone.
    actions:
      - actor: loader
        method: createChild
        arguments: ["ROOT", "bookFiles", "com.scivicslab.turingworkflow.plugins.rstframe.BookFileJobIIAR"]
      - actor: this
        method: addWorker
        arguments: ["writer", 'jexl:state.getString("writer")']
        execution: direct
      - actor: this
        method: setChatAgentLoop
        arguments: ['jexl:state.getString("writer")', "plain-text-no-context-loop.yaml"]
        execution: direct
      - actor: this
        method: setChatModel
        arguments: ['jexl:state.getString("writer")', 'jexl:state.getString("writerModel")']
        execution: direct
      - actor: this
        method: setChatNoThink
        arguments: ['jexl:state.getString("writer")', 'jexl:state.getString("writerNoThink")']
        execution: direct
      - actor: this
        method: clearWorker
        arguments: ["writer"]
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: asked, value: "0"}
        execution: direct

  - states: ["1", "pick"]
    label: find-the-next-file
    actions:
      - actor: bookFiles
        method: next
        arguments: {dir: 'jexl:state.getString("book")'}
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: pick, value: "jexl:result"}
        execution: direct

  - states: ["1", "failed"]
    label: no-book
    actions: [{actor: this, method: doNothing, arguments: ["the book's directory could not be read"], execution: direct}]

  - states: ["pick", "end"]
    label: every-file-is-done
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("pick.done") == "true"'
        execution: direct
      - actor: loader
        method: removeChild
        arguments: "bookFiles"
      - actor: this
        method: finish
        arguments: ["outcome"]
        execution: direct

  - states: ["pick", "next"]
    label: open-the-file
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("pick.done") == "false"'
        execution: direct
      - actor: bookFiles
        method: open
        arguments: {file: 'jexl:state.getString("pick.file")'}
        execution: direct

  - states: ["pick", "failed"]
    label: file-could-not-be-opened
    actions: [{actor: this, method: doNothing, arguments: ["the next file could not be opened"], execution: direct}]

  - states: ["next", "decide"]
    label: take-the-next-question
    actions:
      - actor: bookFiles
        method: question
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: q, value: "jexl:result"}
        execution: direct

  - states: ["decide", "write"]
    label: no-question-left-in-the-file
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("q.done") == "true"'
        execution: direct

  - states: ["decide", "ask"]
    label: a-question-is-left
    note: countUp bounds the run.
    actions:
      - actor: this
        method: onlyIf
        arguments: 'jexl:state.getString("q.done") == "false"'
        execution: direct
      - actor: this
        method: countUp
        arguments: ["asked", 'jexl:state.getString("maxQuestions")']
        execution: direct

  - states: ["decide", "failed"]
    label: too-many-questions
    actions: [{actor: this, method: doNothing, arguments: ["maxQuestions was passed"], execution: direct}]

  - states: ["ask", "next"]
    label: ask-the-writer
    actions:
      - actor: this
        method: askWorker
        arguments:
          - writer
          - 'jexl:state.getString("q.question")'
        execution: direct
      - actor: this
        method: keepWorkerReply
        arguments: ["writer", "reply"]
        execution: direct
      - actor: bookFiles
        method: answer
        arguments: {reply: 'jexl:state.getString("reply")'}
        execution: direct

  - states: ["ask", "failed"]
    label: writer-gave-no-answer
    actions: [{actor: this, method: doNothing, arguments: ["the writer gave no answer"], execution: direct}]

  - states: ["write", "1"]
    label: write-the-rule-file
    note: The rule file is written beside the markdown file, never over a file already there; then the next file.
    actions:
      - actor: bookFiles
        method: write
        execution: direct
      - actor: this
        method: putJson
        arguments: {path: outcome, value: "jexl:result"}
        execution: direct

  - states: ["write", "failed"]
    label: could-not-write
    actions: [{actor: this, method: doNothing, arguments: ["the rule file could not be written, or it is already there"], execution: direct}]

  - states: ["failed", "end"]
    label: report-failure
    actions:
      - actor: loader
        method: removeChild
        arguments: "bookFiles"
      - actor: this
        method: reportFailure
        arguments: []
        execution: direct
