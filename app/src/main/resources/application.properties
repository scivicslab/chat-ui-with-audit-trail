# chat-ui-with-audit-trail
quarkus.http.port=28030

# ---- ChatSession / openai-compat provider ----
# Comma-separated OpenAI-compatible server base URLs. Points at quarkus-gpu-broker's
# OpenAiCompatResource (/v1/chat/completions, /v1/models) rather than a fixed vLLM node
# directly, so requests get the broker's queueing/admission-control/multi-node routing.
chat-ui.servers=http://localhost:28005
# Default model (leave blank to auto-detect the first available)
chat-ui.default-model=google/gemma-4-26B-A4B-it

# ---- Files a conversation may read and write (FileAccessScope_260830_oo01) ----
# Read covers all of ~/works: the documentation portals a conversation searches with search_docs
# live there, and reading the source it is asked about is the same range. Skill roots
# (chat-ui.skill-roots, default ~/.claude/skills) are readable without being listed here, since
# load_skill's third loading level is this same read tool.
chat-ui.read-roots=${user.home}/works
# Write covers the same range as read. A conversation is asked to write documents into the same
# tree it reads them from, and a narrower root did not refuse those writes — it silently resolved
# them somewhere else: "write doc_SCIVICS000/docs/.../x.md" reported success while the file landed
# under chat-ui-scratch/doc_SCIVICS000/..., where nobody looked for it.
#
# The cost of this range is real and is accepted deliberately: a conversation can now overwrite the
# documents it cites and the source it reads. What it must not reach is the skills that steer it,
# and those live outside ~/works (chat-ui.skill-roots, default ~/.claude/skills), which stays
# readable and unwritable.
chat-ui.write-root=${user.home}/works


# ---- Plugin jars (ProviderAndToolPlugins_260912_oo01) ----
# Comma-separated paths of plugin jars, loaded once at start-up. Unset: the body alone, whose
# only provider kind is openai-compat and whose tools reach nothing beyond chat-ui.servers and the
# document index. plugin-web-tools adds web_search and fetch; plugin-harness adds the claude and
# codex provider kinds. See ThreeStartupConfigurations_260912_oo01.
#chat-ui.plugins=chat-ui-with-audit-trail-plugin-web-tools.jar,chat-ui-with-audit-trail-plugin-harness.jar

# ---- CLI harness providers (CliHarnessProvider_260912_oo01; read by plugin-harness) ----
# A conversation switches to Claude Code or Codex with POST .../chats/{chatId}/provider; these
# settings are shared by every harness provider this instance creates.
# Claude Code's --permission-mode. bypassPermissions, as in quarkus-chat-ui: what constrains a
# turn is the Turing workflow the conversation runs under, not a permission dialog.
#chat-ui.harness.permission-mode=bypassPermissions
# One session file per conversation and harness, so a provider created again resumes its session.
#chat-ui.harness.session-dir=${user.home}/.chat-ui-with-audit-trail/harness-sessions
# Default model of a new Claude Code conversation (an alias the CLI resolves).
#chat-ui.harness.claude-model=sonnet
# Default model of a new Codex conversation, passed as -m. The model named in ~/.codex/config.toml
# is not used: a ChatGPT account refuses gpt-5.2-codex and gpt-5.4, and offers gpt-5.5.
#chat-ui.harness.codex-model=gpt-5.5
